<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>校园饮品店经营体验</title>
    <link rel="stylesheet" href="../_shared/sim-game.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script>
      window.SIM_GAME_CONFIG = {
        id: "campus-drinks",
        title: "校园饮品店经营体验",
        kicker: "校园门店经营 · demo",
        logo: "饮",
        roundUnit: "轮",
        intro: "经营一学期的关键节点浓缩为三轮决策，你的饮品店交出了这样一份答卷。",
        theme: { primary: "#247456", primaryContainer: "#e9f6f1", onPrimaryContainer: "#1a5a43", accent: "#247456" },
        optionStyle: "rows",
        metricStyle: "list",
        rounds: [
          {
            id: "menu",
            title: "第 1 轮 · 菜单定价",
            scenario: "刚开业，菜单怎么定决定第一印象和单量。",
            options: [
              { id: "lowprice", label: "爆款平价果茶", hint: "学生价格敏感，走量", effect: "日均单提升，毛利偏低", metrics: { daily: 30, margin: -4, repurchase: 2, waste: 1 } },
              { id: "premium", label: "高毛利新品", hint: "毛利高，但需要教育用户", effect: "毛利提升，复购待培养", metrics: { daily: 10, margin: 8, repurchase: -2, waste: -3 } },
              { id: "combo", label: "饮品+小食套餐", hint: "抬客单，出餐更慢", effect: "客单提升，高峰排队压力", metrics: { daily: 14, margin: 3, repurchase: 4, waste: -4 } }
            ]
          },
          {
            id: "marketing",
            title: "第 2 轮 · 营销活动",
            scenario: "开业第一波活动，怎么拉人气？",
            options: [
              { id: "gift", label: "开业满赠", hint: "拉新立竿见影", effect: "新客提升，毛利承压", metrics: { daily: 26, margin: -5, repurchase: 2, waste: -1 } },
              { id: "member", label: "会员储值", hint: "锁住现金流，促复购", effect: "复购与现金流提升", metrics: { daily: 12, margin: 2, repurchase: 10, waste: 0 } },
              { id: "group", label: "同学拼单", hint: "社群传播，客单稳定", effect: "订单提升，毛利稳定", metrics: { daily: 18, margin: 0, repurchase: 4, waste: 2 } }
            ]
          },
          {
            id: "operation",
            title: "第 3 轮 · 高峰履约",
            scenario: "单量上来了，高峰时段怎么接住？",
            options: [
              { id: "prep", label: "提前备料", hint: "缩短高峰期等待", effect: "体验改善，损耗风险上升", metrics: { daily: 6, margin: -1, repurchase: 3, waste: -6 } },
              { id: "staff", label: "增加人手", hint: "覆盖高峰时段", effect: "成本上升，出餐更稳", metrics: { daily: 8, margin: -3, repurchase: 2, waste: 3 } },
              { id: "app", label: "小程序预点", hint: "错峰出餐，方便复购", effect: "复购提升，损耗改善", metrics: { daily: 4, margin: 1, repurchase: 8, waste: 5 } }
            ]
          }
        ],
        base: { daily: 180, margin: 12, repurchase: 22, waste: 70 },
        metrics: [
          { key: "daily", label: "日均单量", format: function (v) { return Math.round(v * 1.5) + " 单"; } },
          { key: "margin", label: "综合毛利", format: function (v) { return v.toFixed(1) + "%"; }, clamp: [5, 30] },
          { key: "repurchase", label: "复购率", format: function (v) { return v.toFixed(0) + "%"; }, clamp: [10, 45] },
          { key: "waste", label: "损耗控制", format: function (v) { return v.toFixed(0); }, clamp: [50, 100] }
        ],
        virtualPlayers: [
          { name: "模拟经营者·周", daily: 300, margin: 16, repurchase: 26, waste: 74 },
          { name: "模拟经营者·陈", daily: 340, margin: 12, repurchase: 22, waste: 68 },
          { name: "模拟经营者·刘", daily: 260, margin: 20, repurchase: 30, waste: 80 },
          { name: "模拟经营者·王", daily: 320, margin: 14, repurchase: 24, waste: 72 },
          { name: "模拟经营者·许", daily: 280, margin: 18, repurchase: 28, waste: 76 }
        ],
        summarize: function (choices) {
          var d = { daily: 0, margin: 0, repurchase: 0, waste: 0 };
          choices.forEach(function (c) {
            d.daily += c.metrics.daily;
            d.margin += c.metrics.margin;
            d.repurchase += c.metrics.repurchase;
            d.waste += c.metrics.waste;
          });
          var key = Object.keys(d).sort(function (a, b) { return d[b] - d[a]; })[0];
          var messages = {
            daily: "你更看重单量和人气，门店运转得热热闹闹。下一步要留意毛利和损耗，别只赚吆喝。",
            margin: "你的定价更看重利润，把毛利结构守住了。盘子稳下来后，可以把单量再往上拉。",
            repurchase: "你把重心放在回头客上，复购基础扎实，口碑会慢慢带来更多生意。",
            waste: "你的履约和备货控制得不错，损耗低、出品稳，长期经营更有底气。"
          };
          return messages[key];
        }
      };
    </script>
    <script src="../_shared/sim-game.js"></script>
  </body>
</html>
