# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "zh-CN"
tone_instructions: "简洁、直接、产品化；优先指出可验证的 UI/UX 问题，避免无关的代码风格挑剔。"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    用中文总结本次 PR 对用户体验的实际影响。优先说明：
    1. 页面或交互发生了什么变化；
    2. 是否存在视觉一致性、信息层级、移动端可用性或状态覆盖风险；
    3. 哪些问题必须通过浏览器/真机视觉验收确认。
    不要把纯代码重构写成用户可感知变化。
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "dev"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/playwright-report*/**"
    - "!**/test-results/**"
    - "!package-lock.json"
    - "!output/**"
    - "!tmp/**"

  path_instructions:
    - path: "apps/mobile/src/**/*.{ts,tsx,css}"
      instructions: |
        这是移动端产品界面，Review 以 UI/UX 为第一优先级。遵循仓库根目录 AGENTS.md，尤其是 Com Design、mobile-first、compact-first、flat-first 约束。

        重点检查：
        - 信息架构与层级：是否出现重复入口、重复信息、无意义标题栏、过多卡片嵌套、主次不清或功能平铺无分组。
        - 移动端布局：默认页面 edge inset 16px；避免横向溢出、固定宽度导致小屏破版、底部 Tab/悬浮元素遮挡内容、安全区处理缺失。
        - 触控与交互：主要可点击区域应达到约 44x44px；不要只靠很小的图标或文字承担关键操作；危险操作需要清晰反馈或确认。
        - 视觉一致性：优先使用现有 Com Design token 和已有组件；已有语义 token 时，避免随意新增硬编码颜色、间距、圆角、阴影或字号。
        - 视觉气质：保持 compact / flat；普通 Card 不应默认使用重阴影、夸张渐变、过大圆角或无必要的大面积装饰。
        - Icon/素材：Icon 应优先使用 @prototype/icons 的语义图标；不要在业务代码中散落自定义 SVG、emoji 充当正式功能图标或重复造已有素材。
        - 状态完整性：关键页面/模块应考虑 ready、loading、empty、error、permission，避免空白、死按钮、无反馈操作。
        - 文本与内容：检查中文长文本截断、换行、数字/徽章拥挤、头像/标题/副标题基线错位，以及文案重复造成的信息噪声。
        - 可访问性：检查明显的对比度风险、仅靠颜色表达状态、缺失 aria/label、不可键盘/屏幕阅读器识别的交互元素。
        - 用户感知回归：如果代码变更可能造成视觉跳动、布局抖动、点击区域变化、滚动异常、层级遮挡或交互路径变长，应明确指出。

        Review 原则：
        - 优先报告用户能感知、能验证的问题；不要为了“最佳实践”制造与当前原型目标无关的重构建议。
        - 能从代码确认的写成问题；必须看渲染结果才能确认的写成“视觉验收风险”，不要假装已经看过页面。
        - 不因个人审美偏好要求改版；只有当变更违反既有 Design System、产品事实、可用性或一致性时才提出。

    - path: "apps/pc/src/**/*.{ts,tsx,css}"
      instructions: |
        这是 PC 端产品界面。Review 仍以 UI/UX 为优先，但不要把移动端布局机械套到 PC。
        - PC / Mobile 应共享业务语义、Token 和状态，但允许不同布局。
        - 检查信息层级、密度、对齐、响应式断点、空白利用、悬浮/弹层遮挡、滚动容器和键盘可达性。
        - 优先复用 Com Design token / 组件，避免无必要的硬编码视觉值和自定义 SVG。
        - 检查 ready/loading/empty/error/permission 等关键状态，以及按钮是否真的有可验证反馈。
        - 只报告用户可感知或设计系统层面的有效问题，避免无关代码洁癖。
        - 必须依赖渲染才能确认的视觉问题，应标记为需要浏览器视觉验收，而不是直接断言。

    - path: "**/tailwind.config.{js,ts}"
      instructions: |
        重点检查 Tailwind 配置是否破坏 Com Design token 单一来源：
        - 不要为了单个页面随意加入新的品牌色、阴影、圆角、spacing 或字号。
        - 新增视觉值应有明确复用价值，并与现有语义 token / Design System 对齐。
        - 警惕会导致 PC/Mobile 视觉语义漂移的重复 token。

    - path: "packages/shared/**/*.{ts,tsx,css}"
      instructions: |
        共享层只应承载真正跨端稳定的语义、类型、Token 或无端侧偏好的能力。
        - 不要为了复用强迫 PC 与 Mobile 共享具体布局。
        - UI 相关共享改动要检查是否会同时造成两端视觉/交互回归。
        - 若共享组件引入端侧特定间距、尺寸或交互假设，应指出并建议留在端侧。

knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
