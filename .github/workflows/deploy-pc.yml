name: Deploy PC to Cloudflare Pages

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - "apps/pc/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-pc.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy PC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build PC preview
        if: github.ref_name == 'dev'
        run: npm run build:development --workspace @core/pc

      - name: Type-check and build PC production
        if: github.ref_name != 'dev'
        run: npm run build:pc

      - name: Deploy PC
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy apps/pc/dist --project-name=core-industry-college-pc --branch=${{ github.ref_name }}
