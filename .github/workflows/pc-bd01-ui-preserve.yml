name: PC-BD01 preserve existing action UI

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/pc-bd01-ui-preserve.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Preserve existing action bars while keeping merged semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/pc/src/admin/BasicDataConsole.tsx")
          text = path.read_text()

          replacements = [
            (
              '<div className="flex flex-wrap gap-2"><Link to="/admin/basic-data/imports" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold text-text-secondary">导入补充数据</Link><Link to="/admin/students" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">查看学生控制台</Link></div>',
              '<div className="flex flex-wrap gap-2"><Link to="/admin/basic-data/imports" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold text-text-secondary">批量导入</Link><SecondaryButton>导出</SecondaryButton><SecondaryButton>补充 StudentProfile</SecondaryButton><Link to="/admin/students" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">查看学生控制台</Link></div>'
            ),
            (
              '<section className="rounded-container border border-border-subtle bg-surface p-5 text-sm text-text-secondary"><h3 className="font-semibold">维护入口</h3><div className="mt-4 flex flex-wrap gap-2"><Link to="/admin/students" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">查看学生控制台</Link><Link to="/admin/basic-data/imports" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">导入补充数据</Link><Link to="/admin/governance" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">查看治理与审计</Link></div></section>',
              '<section className="rounded-container border border-border-subtle bg-surface p-5 text-sm text-text-secondary"><h3 className="font-semibold">可执行动作（原型）</h3><div className="mt-4 flex flex-wrap gap-2"><Link to="/admin/students" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">编辑 / 查看 StudentProfile</Link><Link to="/admin/basic-data/imports" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">查看关联导入批次</Link><Link to="/admin/students" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">查看赛事身份</Link><Link to="/admin/governance" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">查看账号治理与审计</Link></div><p className="mt-3 text-xs leading-5 text-text-tertiary">动作继续落在 Account / StudentProfile、CompetitionIdentity、Governance 与导入治理域；这里不生成 Profile 状态。</p></section>'
            ),
            (
              '<Link to="/admin/organizations" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">去主体与学校维护</Link>',
              '<div className="flex flex-wrap gap-2"><Link to="/admin/basic-data/imports" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold text-text-secondary">批量导入</Link><Link to="/admin/organizations" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">+ 新建 / 维护学校主体</Link></div>'
            ),
            (
              '<section className="rounded-container border border-border-subtle bg-surface p-5"><Link to={`/admin/organizations/${school.id}`} className="inline-flex min-h-10 items-center gap-1 rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">去“主体与学校”继续维护 <ArrowRight size={15} /></Link></section>',
              '<section className="rounded-container border border-border-subtle bg-surface p-5 text-sm text-text-secondary"><h3 className="font-semibold">可执行动作（原型）</h3><div className="mt-4 flex flex-wrap gap-2"><Link to={`/admin/organizations/${school.id}`} className="inline-flex min-h-10 items-center gap-1 rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">编辑学校主体 <ArrowRight size={15} /></Link><Link to="/admin/competitions" className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">配置赛事范围</Link><Link to={`/admin/organizations/${school.id}`} className="inline-flex min-h-10 items-center rounded-control border border-border-subtle px-3 text-sm font-semibold">查看主体关系</Link></div></section>'
            ),
            (
              '<Link to="/admin/competitions" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">去赛事中心维护</Link>',
              '<Link to="/admin/competitions" className="inline-flex min-h-10 items-center rounded-control bg-primary px-3 text-sm font-semibold text-on-primary">去所属域新增 / 维护</Link>'
            ),
            (
              '<div><h2 className="font-semibold">模板与规则索引</h2><p className="mt-1 text-xs text-text-tertiary">共 {templates.length} 条 · 版本与发布状态均读取所属业务域。</p></div></div>',
              '<div><h2 className="font-semibold">模板与规则索引</h2><p className="mt-1 text-xs text-text-tertiary">共 {templates.length} 条 · 版本与发布状态均读取所属业务域。</p></div><SecondaryButton>按归属域维护 / 发布</SecondaryButton></div>'
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f"missing expected UI fragment: {old[:80]}")
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove helper and commit UI-preserving patch
        shell: bash
        run: |
          rm .github/workflows/pc-bd01-ui-preserve.yml
          git config user.name "Mira PC-BD01"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pc): preserve basic-data action UI during semantic merge"
          git pull --rebase origin dev
          git push origin HEAD:dev
