name: F003 Focused Browser

on:
  push:
    branches:
      - workbench/f003-fix
    paths:
      - "apps/mobile/**"
      - ".github/workflows/f003-focused-browser.yml"

permissions:
  contents: read

jobs:
  chromium:
    name: F003 Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile development preview
        run: npm run build:development --workspace @core/mobile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused F003 browser regression
        run: npm run e2e --workspace @core/mobile -- tests/f003.spec.ts
