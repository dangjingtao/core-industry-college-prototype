name: F001 Phone Verification Browser Check

on:
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/src/features/long-term-assets/StudentProfilePages.tsx"
      - "apps/mobile/tests/f001-phone-verification.spec.ts"
      - ".github/workflows/f001-browser-check.yml"

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile preview
        run: npm run build:development --workspace @core/mobile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused F001 browser test
        run: npm run e2e --workspace @core/mobile -- tests/f001-phone-verification.spec.ts
