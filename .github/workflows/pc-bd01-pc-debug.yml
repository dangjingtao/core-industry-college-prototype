name: PC-BD01 PC focused debug

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/pc-bd01-pc-debug.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/pc
      - name: Run focused failing PC tests
        shell: bash
        run: |
          set +e
          cd apps/pc
          npx playwright test \
            tests/admin-skeleton.spec.ts:103 \
            tests/pc03.spec.ts:49 \
            tests/pc03.spec.ts:105 \
            tests/pc05.spec.ts:51 \
            tests/pc05.spec.ts:76 \
            --reporter=line > ../../docs/workbench/PC-BD01-pc-debug.log 2>&1
          code=$?
          echo "exit_code=$code" >> ../../docs/workbench/PC-BD01-pc-debug.log
          exit 0
      - name: Publish debug log and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pc-bd01-pc-debug.yml
          git config user.name 'Mira PC-BD01'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/workbench/PC-BD01-pc-debug.log .github/workflows/pc-bd01-pc-debug.yml
          git commit -m 'test(pc): capture PC-BD01 focused failures'
          git push origin HEAD:dev
