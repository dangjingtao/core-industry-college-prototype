name: T013A Focused Validation

on:
  push:
    branches:
      - feat/t013a-s1-s2-current

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify mobile routes, types and build
        run: npm run verify --workspace @core/mobile

      - name: Run T013A focused browser flows
        run: npm run e2e --workspace @core/mobile -- tests/t013a-workshop.spec.ts

      - name: Run existing T013 workshop regressions
        run: npm run e2e --workspace @core/mobile -- tests/t013-workshop.spec.ts
