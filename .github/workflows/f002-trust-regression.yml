name: F002 Trust Status Regression

on:
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/src/features/trust/TrustPages.tsx"
      - "apps/mobile/tests/f002-trust-status.spec.ts"
      - ".github/workflows/f002-trust-regression.yml"
  workflow_dispatch:

concurrency:
  group: f002-trust-status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-regression:
    name: claimable to claimed trust gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        working-directory: apps/mobile
        run: npx playwright install --with-deps chromium

      - name: Build mobile preview
        run: npm run build:development --workspace @core/mobile

      - name: Run focused F002 browser regression
        working-directory: apps/mobile
        run: npx playwright test tests/f002-trust-status.spec.ts
