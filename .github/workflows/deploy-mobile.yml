name: Deploy Mobile to Cloudflare Pages

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-mobile.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build mobile preview
        if: github.ref_name == 'dev'
        run: npm run build:development --workspace @core/mobile

      - name: Type-check and build mobile production
        if: github.ref_name != 'dev'
        run: npm run build:mobile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run F00 cross-app browser regression
        run: npm run verify:browser:handoff --workspace @core/mobile

      - name: Deploy mobile
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy apps/mobile/dist --project-name=core-industry-college-mobile --branch=${{ github.ref_name }}
