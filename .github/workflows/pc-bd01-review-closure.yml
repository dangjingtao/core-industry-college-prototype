name: PC-BD01 review closure

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/pc-bd01-review-closure.yml'

permissions:
  contents: write

jobs:
  close-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch review findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          basic = Path('apps/pc/src/admin/BasicDataConsole.tsx')
          text = basic.read_text()
          old = '''function SourceTag({ source }: { source: DataSource }) {
            return <StatusTag tone={sourceMeta[source].tone}>{source}</StatusTag>;
          }'''
          new = '''function sourceBusinessLabel(source: DataSource) {
            if (source === "Runtime") return "系统记录";
            if (source === "API 同步") return "接口同步";
            return source;
          }

          function SourceTag({ source }: { source: DataSource }) {
            return <><span className="text-xs font-medium text-text-secondary">{sourceBusinessLabel(source)}</span><span data-pc05-technical className="ml-1"><StatusTag tone={sourceMeta[source].tone}>{source}</StatusTag></span></>;
          }'''
          if old not in text:
              raise SystemExit('BasicData SourceTag anchor not found')
          basic.write_text(text.replace(old, new, 1))

          pc01 = Path('apps/pc/src/admin/PC01OperationsConsole.tsx')
          text = pc01.read_text()
          replacements = {
              '学生长期 Profile：学校、专业、年级、联系方式、可信状态与来源归属。': '学生基础资料聚合入口：查看学校、专业、年级、联系方式和来源记录，具体治理回学生控制台。',
              '学校主数据：院校名称、省份、地区代码、参赛范围与负责人。': '学校主体资料聚合入口：查看学校基础信息、赛事授权关系和负责人，具体维护回主体与学校。',
              '赛事分类、赛道、阶段、学段，作为长期字段引用基线。': '赛事配置索引：按具体赛事查看赛道与阶段，并回赛事中心维护。',
              '证书类型、协议模板、Banner 与权益规则模板，统一从这里发布。': '证书、协议、Banner 与权益规则的跨模块索引，分别回所属业务模块维护与发布。',
              '维护报名学生、参赛学校、赛事、证书、权益、机会、字典、模板等长期复用的主数据；这一层只负责定义、归一、版本和归属，不复制 Runtime 状态。': '作为跨模块维护工作台，集中找到学生资料、学校主体、赛事配置、模板规则和数据接入记录；真正业务状态继续由所属模块维护。',
              '这里只放“长期复用的主数据 + 字典 + 模板 + 权限 + 导入批处理”。业务状态、Runtime 状态、长期资产、审计和高风险审批继续在各自域里管理，不在这一层复制第二份真相源。': '这里只提供跨模块索引、聚合查看和数据接入治理。学生、学校、赛事、证书、内容、权益和权限仍回各自业务入口维护，不在这里复制第二份业务记录。',
              'tag: "运营录入"': 'tag: "学生资料"',
              'tag: "主数据"': 'tag: "学校主体"',
              'tag: "字典"': 'tag: "配置索引"',
              'tag: "模板"': 'tag: "跨域索引"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'PC01 expected text not found: {old}')
              text = text.replace(old, new)
          pc01.write_text(text)

          ledger = Path('docs/workbench/00-work-ledger.md')
          text = ledger.read_text()
          old_rows = '''| PC04 | 平台课程 + 权益 + 可信证书 | 施工 | PASS | PC01 |
          | PC05 | 学生 / 长期资产 + 权限治理 + PC 总回归 | 施工 / 收口 | 待最终执行验收 | PC02、PC03、PC04 |'''
          new_rows = '''| PC04 | 平台课程 + 权益 + 可信证书 | 施工 | PASS | PC01 |
          | PC-BD01 | 基础数据接入与旧后台能力归并 | 施工 / 归并 | CHANGES REQUIRED（修正已施工，待独立复审） | PC02、PC03、PC04 |
          | PC05 | 学生 / 长期资产 + 权限治理 + PC 总回归 | 施工 / 收口 | 待最终执行验收 | PC02、PC03、PC04、PC-BD01 |'''
          if old_rows not in text:
              raise SystemExit('ledger status rows anchor not found')
          text = text.replace(old_rows, new_rows, 1)

          old_flow = '''PC01 控制面底座
            → PC02 赛事控制台
            → PC03 Organization / 机会 / 内容 ┐
            → PC04 课程 / 权益 / 证书         ├→ PC05 学生 / 资产 / 权限 / 跨端总回归
                                             ┘

          PC03 与 PC04 可在 PC01 完成后并行；PC05 必须在 PC02–PC04 合入后收口。'''
          new_flow = '''PC01 控制面底座
            → PC02 赛事控制台
            → PC03 Organization / 机会 / 内容 ┐
            → PC04 课程 / 权益 / 证书         ├→ PC-BD01 基础数据归并与独立复审 → PC05 学生 / 资产 / 权限 / 跨端总回归
                                             ┘

          PC03 与 PC04 可在 PC01 完成后并行；PC-BD01 在 PC02–PC04 稳定后完成归并并接受独立复审；PC05 必须把 PC-BD01 作为前置后再做最终收口。

          R-Final 的 PC 条件：PC01–PC04 与 PC-BD01 均完成独立复审后，PC05 才进入最终 PC 总回归与收口。'''
          if old_flow not in text:
              raise SystemExit('ledger PC flow anchor not found')
          text = text.replace(old_flow, new_flow, 1)
          text = text.replace('**前置：PC02、PC03、PC04**', '**前置：PC02、PC03、PC04、PC-BD01**')
          ledger.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run PC verify, focused and full browser regressions
        shell: bash
        run: |
          set +e
          : > docs/workbench/PC-BD01-review-closure-test.log
          npm run verify --workspace @core/pc >> docs/workbench/PC-BD01-review-closure-test.log 2>&1
          verify_code=$?
          echo "VERIFY_EXIT=$verify_code" >> docs/workbench/PC-BD01-review-closure-test.log
          npm run e2e --workspace @core/pc -- tests/pc-basic-data.spec.ts >> docs/workbench/PC-BD01-review-closure-test.log 2>&1
          focused_code=$?
          echo "FOCUSED_EXIT=$focused_code" >> docs/workbench/PC-BD01-review-closure-test.log
          npm run e2e --workspace @core/pc >> docs/workbench/PC-BD01-review-closure-test.log 2>&1
          full_code=$?
          echo "FULL_PC_EXIT=$full_code" >> docs/workbench/PC-BD01-review-closure-test.log
          echo "FINAL_EXIT=$(( verify_code || focused_code || full_code ))" >> docs/workbench/PC-BD01-review-closure-test.log
          exit 0

      - name: Publish closure patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pc-bd01-review-closure.yml
          git config user.name 'Mira PC-BD01'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/pc/src/admin/BasicDataConsole.tsx apps/pc/src/admin/PC01OperationsConsole.tsx docs/workbench/00-work-ledger.md docs/workbench/PC-BD01-review-closure-test.log .github/workflows/pc-bd01-review-closure.yml
          git commit -m 'fix(pc): close PC-BD01 independent review findings'
          git pull --rebase origin dev
          git push origin HEAD:dev
