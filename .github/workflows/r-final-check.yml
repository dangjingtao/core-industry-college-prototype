name: R-Final Full Regression

on:
  push:
    branches:
      - dev
      - feat/t013a-workshop-s1-s2
    paths:
      - ".github/workflows/r-final-check.yml"
      - "apps/mobile/**"
      - "apps/pc/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  statuses: write

jobs:
  r-final:
    runs-on: ubuntu-latest
    steps:
      - name: Publish temporary pending status
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: "pending",
              context: "t013a-branch-r-final",
              description: "T013A branch R-Final is running"
            });

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify mobile routes, types and build
        run: npm run verify --workspace @core/mobile

      - name: Run mobile mother flows and feature regressions
        run: >-
          npm run e2e --workspace @core/mobile --
          tests/mother-flows.spec.ts
          tests/f001-phone-verification.spec.ts
          tests/f002-trust-status.spec.ts
          tests/f003.spec.ts
          tests/r-final.spec.ts
          tests/t013a-workshop.spec.ts

      - name: Run real Mobile-PC-Mobile handoff
        run: npm run verify:browser:handoff --workspace @core/mobile

      - name: Verify PC types and build
        run: npm run verify --workspace @core/pc

      - name: Run PC browser regressions
        run: npm run e2e --workspace @core/pc

      - name: Publish temporary success status
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: "success",
              context: "t013a-branch-r-final",
              description: "T013A branch R-Final passed"
            });

      - name: Publish temporary failure status
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: "failure",
              context: "t013a-branch-r-final",
              description: "T013A branch R-Final failed"
            });
