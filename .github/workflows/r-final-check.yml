name: Prototype Quality Gate

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/r-final-check.yml"
      - "apps/mobile/**"
      - "apps/pc/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"

jobs:
  prototype-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify mobile routes, types and build
        run: npm run verify --workspace @core/mobile

      - name: Run mobile browser regressions (soft gate)
        id: mobile-regressions
        continue-on-error: true
        run: >-
          npm run e2e --workspace @core/mobile --
          tests/mother-flows.spec.ts
          tests/f001-phone-verification.spec.ts
          tests/f002-trust-status.spec.ts
          tests/f003.spec.ts
          tests/r-final.spec.ts
          tests/t013-workshop.spec.ts
          tests/t013b-s3s4.spec.ts

      - name: Run real Mobile-PC-Mobile handoff (soft gate)
        id: mobile-pc-handoff
        continue-on-error: true
        run: npm run verify:browser:handoff --workspace @core/mobile

      - name: Verify PC types and build
        run: npm run verify --workspace @core/pc

      - name: Run PC browser regressions (soft gate)
        id: pc-regressions
        continue-on-error: true
        run: npm run e2e --workspace @core/pc

      - name: Summarize prototype diagnostics
        if: always()
        shell: bash
        env:
          MOBILE_REGRESSIONS: ${{ steps.mobile-regressions.outcome }}
          MOBILE_PC_HANDOFF: ${{ steps.mobile-pc-handoff.outcome }}
          PC_REGRESSIONS: ${{ steps.pc-regressions.outcome }}
        run: |
          {
            echo "## Prototype Quality Gate"
            echo
            echo "Hard gate: install, mobile verify, PC verify."
            echo "Browser regressions are diagnostic during prototype iteration and do not block the workflow."
            echo
            echo "| Diagnostic suite | Outcome |"
            echo "| --- | --- |"
            echo "| Mobile browser regressions | ${MOBILE_REGRESSIONS} |"
            echo "| Mobile-PC-Mobile handoff | ${MOBILE_PC_HANDOFF} |"
            echo "| PC browser regressions | ${PC_REGRESSIONS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          for outcome in "$MOBILE_REGRESSIONS" "$MOBILE_PC_HANDOFF" "$PC_REGRESSIONS"; do
            if [ "$outcome" = "failure" ]; then
              echo "::warning::Prototype browser regression failed; retained as diagnostic only."
            fi
          done
